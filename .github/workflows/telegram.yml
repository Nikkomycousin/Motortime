name: Canale Telegram

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pubblica sul canale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID || '@motortimeitalia' }}
        run: python3 tools/telegram_post.py
      - name: Salva i messaggi già inviati
        run: |
          git add tools/telegram_state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Motortime"
          git config user.email "motortime@users.noreply.github.com"
          git commit -m "Canale Telegram: messaggi inviati"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
